# tripline: Linux sshd Sigma rules -> Splunk (linux_secure sourcetype, Splunk Add-on for Unix
# and Linux field names). tripline's sshd field names follow Sentinel's Syslog table, which
# Splunk does not have, so they are mapped here instead of passed through.
name: tripline splunk sshd
priority: 20
transformations:
  - id: splunk_sshd_fields
    type: field_name_mapping
    mapping:
      SyslogMessage: _raw
      ProcessName: process
      HostName: host
      SourceIp: src
      User: user
  - id: splunk_sshd_sourcetype
    type: add_condition
    conditions:
      sourcetype: linux_secure
      process: sshd
