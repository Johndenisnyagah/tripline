title: AWS IAM Console Password Created For User
id: 363577ad-a074-48cd-9c66-8d6f7a1d06d1
status: experimental
description: |
    Detects CreateLoginProfile, which gives an IAM user a console password. An attacker with
    IAM write access uses it to open interactive console access for a user they created, or
    for an existing user that previously had API keys only.
references:
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateLoginProfile.html
    - https://github.com/DataDog/stratus-red-team/blob/036d2cab6ad8b331ada271fc8e738dafa19e359e/docs/attack-techniques/AWS/aws.persistence.iam-create-user-login-profile.md
author: John Denis Nyagah
date: 2026-11-04
tags:
    - attack.persistence
    - attack.t1136.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: iam.amazonaws.com
        eventName: CreateLoginProfile
    condition: selection
falsepositives:
    - Onboarding a new human user who needs console access
    - Identity tooling that provisions IAM users with console passwords
level: medium
