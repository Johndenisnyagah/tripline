title: Windows Failed Network Logon From A Remote Address
id: 26e64f0f-3c3e-4aa9-bea7-3bdf3082d9a8
name: win_security_spray_failed_logon
status: experimental
description: |
    Detects a failed Windows logon (4625) that came from a remote address. Base rule for the
    password-spraying correlation below; failures without a source address (local logons,
    "-") or from loopback cannot be attributed to a source and are left out.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
author: John Denis Nyagah
date: 2026-11-04
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    filter_no_source:
        IpAddress:
            - '-'
            - '127.0.0.1'
            - '::1'
    condition: selection and not filter_no_source
falsepositives:
    - Users mistyping their password
level: informational
---
title: Windows Password Spraying From One Source
id: 9d1e7607-ba16-4972-92df-7aa06a25f3dd
status: experimental
description: |
    Detects password spraying against Windows: failed logons (4625) for five or more distinct
    accounts from one source IP address within 10 minutes.
references:
    - https://github.com/splunk/attack_data/tree/c8af10d015d392fca97f9eb65181e9f06bc18e40/datasets/attack_techniques/T1110.003/purplesharp_remote_spray_xml
    - https://github.com/Johndenisnyagah/soc-triage/blob/efd910cd7b881a5d4e95088670b1b7cfe5e1c64b/backend/app/detection/library.py#L100-L139
author: John Denis Nyagah
date: 2026-11-04
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - win_security_spray_failed_logon
    group-by:
        - IpAddress
    timespan: 10m
    condition:
        gte: 5
        field: TargetUserName
falsepositives:
    - A jump host, VPN concentrator or Citrix server through which many users mistype passwords
    - Vulnerability scanners running authenticated checks with several stale credentials
level: high
