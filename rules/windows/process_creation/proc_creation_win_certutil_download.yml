title: File Download Via Certutil
id: 8ee5e77f-9e4e-4811-9767-24d48905cdf8
related:
    - id: 19b08b1c-861d-4e75-a1ef-ea0c1baf202b
      type: derived
status: experimental
description: |
    Detects certutil.exe used to download a file from an HTTP(S) URL with -urlcache,
    -verifyctl or -f: a signed Windows binary fetching a payload.
references:
    - https://github.com/SigmaHQ/sigma/blob/c68bb91abb1146b8a6a65caf6819b1836d97f09d/rules/windows/process_creation/proc_creation_win_certutil_download.yml
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/certutil
author: John Denis Nyagah
date: 2026-11-04
tags:
    - attack.command-and-control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\certutil.exe'
        - OriginalFileName: 'CertUtil.exe'
    selection_flags:
        CommandLine|windash|contains:
            - ' -urlcache'
            - ' -verifyctl'
            - ' -f '
    selection_url:
        CommandLine|contains: 'http'
    condition: all of selection_*
falsepositives:
    - Admins refreshing certificate revocation lists or CA certificates from an internal HTTP URL
level: high
