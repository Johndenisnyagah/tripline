title: SSH Failed Password Authentication
id: 51495cd7-4fbb-45e3-af8e-e92b3e4f2f39
name: lnx_sshd_failed_password
status: experimental
description: |
    Detects a single failed SSH password authentication, for a valid or an invalid user.
    Base rule for the password-guessing correlation below; too noisy to alert on alone.
references:
    - https://github.com/openssh/openssh-portable/blob/3c6ec4c637342c51d9c54bbeecef25fd185cfdb8/auth.c#L283-L298
author: John Denis Nyagah
date: 2026-11-04
tags:
    - attack.credential-access
    - attack.t1110.001
logsource:
    product: linux
    service: sshd
detection:
    selection:
        SyslogMessage|contains: 'Failed password for '
    condition: selection
falsepositives:
    - Users mistyping their password
level: informational
---
title: SSH Password Guessing From One Source
id: fa9d4e52-52d4-4298-9b79-892f13090910
status: experimental
description: |
    Detects password guessing over SSH: five or more failed password attempts from one
    source IP within 10 minutes, across any usernames.
references:
    - https://github.com/Johndenisnyagah/soc-triage/blob/efd910cd7b881a5d4e95088670b1b7cfe5e1c64b/backend/app/detection/library.py#L44-L72
author: John Denis Nyagah
date: 2026-11-04
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - lnx_sshd_failed_password
    group-by:
        - SourceIp
    timespan: 10m
    condition:
        gte: 5
falsepositives:
    - A user or script retrying a forgotten or rotated password many times from one host
    - Several users behind one NAT address mistyping passwords in the same 10 minutes
level: high
