version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # pySigma-backend-kusto 1.0.1 requires pysigma<2, and sigma-cli 4.x crashes next to
      # pySigma 1.x. Lift these only once the kusto backend supports pySigma 2.
      - dependency-name: pySigma
        versions: [">=2"]
      - dependency-name: sigma-cli
        versions: [">=4"]
      # The first releases that require pySigma >=2: splunk 3.0.0, sqlite 2.1.x.
      - dependency-name: pySigma-backend-splunk
        versions: [">=3"]
      - dependency-name: pySigma-backend-sqlite
        versions: [">=2.1"]
