name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"  # weekly, Monday 05:17 UTC: catch upstream dataset or tool changes

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: yamllint
        run: yamllint --strict rules/ pipelines/ .github/ tests/fixtures/ tests/sigma_check.yml

      - name: Sigma backends available
        run: |
          sigma list targets | tee targets.txt
          for t in kusto splunk sqlite; do grep -qE "^\| $t " targets.txt || { echo "missing target $t"; exit 1; }; done

      # tripline's ATT&CK v20.0 bundle (pinned by commit + sha256 in tripline/attack.py) and
      # pySigma's own MITRE ATT&CK / D3FEND downloads, which its tag validators fetch at runtime
      # with a 30 s timeout and which once timed out on a cold runner.
      - name: Cache MITRE data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .cache/attack
            ~/.cache/pysigma
          key: mitre-${{ hashFiles('tripline/attack.py', 'pyproject.toml') }}

      - name: sigma check
        run: |
          # One retry: the first run on a cold cache downloads MITRE data over the network.
          for attempt in 1 2; do
            sigma check --fail-on-error --fail-on-issues -c tests/sigma_check.yml rules/ && exit 0
            echo "sigma check attempt $attempt failed"
          done
          exit 1

      - name: Metadata and environment tests
        run: pytest tests/test_metadata.py tests/test_environment.py

  convert:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Conversion drift check
        run: python -m tripline.convert --check

      - name: Conversion tests
        run: pytest tests/test_convert.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: queries
          path: |
            queries/kql/
            queries/spl/

  test-kql:
    needs: convert
    runs-on: ubuntu-latest
    services:
      # Azure Data Explorer emulator. Used under its licence terms (https://aka.ms/adx.emulator.license)
      # for automated testing only; see the Decisions log in CLAUDE.md.
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:2026.10.20.1451-2641-19d68ab-weeklyproduction
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: KQL in the Kusto emulator
        env:
          TRIPLINE_KQL_RESULTS: kql-results.json
        run: pytest -m kql tests/test_kql.py -v

      # Per-case KQL outcomes for the report job; uploaded even when a case fails.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: kql-results
          path: kql-results.json

  test-logic:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Rule logic and parser tests
        run: pytest tests/test_rules.py tests/test_parsers.py tests/test_kql_sources.py tests/test_corpora.py tests/test_report.py tests/test_readme.py

  corpora:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Downloads (~280 MB) are keyed by the manifest's sha256 values; parsed events also depend
      # on the parsers. The restore key reuses the downloads when only a parser changed.
      - name: Cache corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/corpora
          key: corpora-${{ hashFiles('tests/corpora/manifest.yml') }}-${{ hashFiles('tripline/parsers/**') }}
          restore-keys: corpora-${{ hashFiles('tests/corpora/manifest.yml') }}-

      - name: Run rules over the corpora
        run: |
          python -m tripline.corpora --out corpus-hits.json | tee corpus-hits.md
          {
            echo "## Hits on unlabelled background corpora"
            echo "Not pass/fail and not a false-positive rate. See tests/corpora/manifest.yml."
            echo
            sed '/^wrote /d' corpus-hits.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: corpus-hits
          path: corpus-hits.json

  report:
    needs: [test-logic, test-kql, corpora]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache MITRE data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .cache/attack
            ~/.cache/pysigma
          key: mitre-${{ hashFiles('tripline/attack.py', 'pyproject.toml') }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kql-results

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: corpus-hits

      # Builds docs/results.md and coverage/tripline-layer.json from the logic tests (run here),
      # the emulator results and the corpus hits, and writes the table to the job summary.
      - name: Build results table and Navigator layer
        run: >-
          python -m tripline.report --kql-results kql-results.json
          --corpus-hits corpus-hits.json --out-dir generated

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: report
          path: generated/

      # The committed files must match. On main this fails; on PRs it warns, because the PR
      # commits the files this job generated (download the `report` artifact).
      - name: Committed results up to date
        run: |
          if ! GITHUB_STEP_SUMMARY= python -m tripline.report --kql-results kql-results.json \
               --corpus-hits corpus-hits.json --check; then
            if [ "${{ github.event_name }}" = "push" ]; then exit 1; fi
            echo "::warning::docs/results.md or coverage/tripline-layer.json is stale; commit the files from the 'report' artifact"
          fi
